name: ZenBattle
version: '1.0.0'

main: com.zenavia.zenBattle.ZenBattle
description: Plugin pour le serveur Zenavia, minijeu simple de destruction de Beacon.
author: HyGoww
website: www.hygoww.fr
prefix: ZENBATTLE
depend: [My_Worlds, FastAsyncWorldEdit]
api-version: '26.2'
load: POSTWORLD
commands:
  zb:
    description: Main command for ZenBattle plugin
    usage: /zb <subcommand>
    aliases: [zenbattle, zbattle]
  zbreload:
    description: Recharge la configuration ZenBattle
    permissions:
      zenbattle.reload:
        default: op
